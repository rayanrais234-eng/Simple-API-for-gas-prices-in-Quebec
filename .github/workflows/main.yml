name: Daily price update

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:  

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily_price.py
        run: python scripts/daily_price.py

      - name: Run generer_historique.py
        run: python scripts/generer_historique.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "chore: mise à jour prix quotidien"
          git push
